# reload config
unbind r
bind r source-file ~/.tmux.conf

# change prefix
set -g prefix C-a

# index
set -g base-index 1
set -g renumber-windows on

# pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# panel postion
set-option -g status-position top

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_lavender}"

run "~/.tmux/plugins/tmux/catppuccin.tmux"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_status_background default
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_middle_separator "█"
set -g @catppuccin_window_right_separator "█"

set -ogq @catppuccin_status_connect_separator "yes"
set -ogq @catppuccin_status_fill "icon"
set -ogq @catppuccin_status_module_bg_color "#{@thm_surface_0}"

set -g status-right-length 100
set -g status-left-length 100
set -agF status-right "#{@catppuccin_status_user}"
set -gF status-right "#{@catppuccin_status_directory}"
set -agF status-right "#{@catppuccin_status_application}"
set -agF status-right "#{@catppuccin_status_session}"


# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
