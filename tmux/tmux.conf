# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# prefix
unbind C-s
set -g prefix C-s
bind C-s send-prefix

# index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# command history cash
set-option -g history-limit 5000

# panel
set-option -g status-position top

# session
unbind d
bind-key -n C-d detach

# window
bind d kill-window
# unbind n
# bind-key -n C-Tab next-window
# unbind p
# bind-key -n C-S-Tab previous-window

# pane
# pane navigation
# use this instead of installing vim-tmux-navigator for tmux
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# pane split
unbind %
unbind |
bind | split-window -hc "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
unbind '"'
unbind -
bind - split-window -vc "#{pane_current_path}"
bind "_" split-window -fv -c "#{pane_current_path}"

# plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tpm'
# set -g @plugin 'christoomey/vim-tmux-navigator'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "latte"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -ogq @catppuccin_window_status_style "basic"
set -ogq @catppuccin_status_module_bg_color "#{@thm_surface_0}"
# set -g @catppuccin_window_status_style 'rounded'
# set -g @catppuccin_window_current_number_color "#{@thm_lavender}"
# set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

