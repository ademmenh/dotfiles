# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# prefix
unbind C-a
set -g prefix C-a
bind C-a send-prefix

# mouse
set -g mouse on

# index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# command history cash
set-option -g history-limit 5000

# panel
set-option -g status-position bottom

# window
unbind C-d
unbind d
bind d detach
bind x kill-window
# open new window in the current dire
bind c new-window -c "#{pane_current_path}"

# pane
# pane navigation
# use this instead of installing vim-tmux-navigator for tmux
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# pane split
unbind %
unbind |
bind | split-window -hc "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
unbind '"'
unbind -
bind - split-window -vc "#{pane_current_path}"
bind "_" split-window -fv -c "#{pane_current_path}"

# plugins
set -g @plugin 'tmux-plugins/tpm' 
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'christoomey/vim-tmux-navigator'

# configure catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# set -g @thm_fg "#{@thm_crust}"
set -g @catppuccin_status_background "#{@thm_bg}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_text_color "#{@thm_mantle}"
set -g @catppuccin_window_number_color "#{@thm_red}"

set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_text_color "#{@thm_mantle}"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"

# modules
set -g @catppuccin_status_module_bg_color "#{@thm_crust}"
# set -ag status-right "#{E:@catppuccin_status_directory}"
# set -g @catppuccin_status_directory_text_fg "#{@thm_blue}"
# set -g @catppuccin_directory_color "#{@thm_red}"
# set -g "@catppuccin_directory_text" " #{pane_current_path} "
set -g status-right "#{E:@catppuccin_status_session}"
# set -g @catppuccin_session_color "@thm_blue"
set -g "@catppuccin_session_color" "#{?client_prefix,#{E:@thm_blue},#{E:@thm_red}}"
set -g @catppuccin_status_session_text_fg "#{?client_prefix,#{E:@thm_blue},#{E:@thm_red}}"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""


# Initialize TMUX plugin manager
run ~/.config/tmux/plugins/tpm/tpm

